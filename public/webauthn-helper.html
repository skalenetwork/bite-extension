<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAuthn Helper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 460px;
      width: 100%;
    }
    h1 { font-size: 24px; margin-bottom: 12px; color: #1a1b1f; font-weight: 600; }
    .subtitle { color: #6b7280; margin-bottom: 24px; font-size: 15px; line-height: 1.5; }
    .icon { font-size: 64px; margin-bottom: 20px; }
    .auth-button {
      background: linear-gradient(135deg, #5B6CFF 0%, #4a5ce0 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(91, 108, 255, 0.4);
      margin-bottom: 12px;
    }
    .auth-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91, 108, 255, 0.5); }
    .auth-button:disabled { opacity: 0.6; cursor: not-allowed; }
    .cancel-button { background: transparent; color: #6b7280; border: 1px solid #e5e7eb; padding: 12px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .cancel-button:hover { background: #f5f5f7; color: #1a1b1f; }
    .status { font-size: 15px; color: #5B6CFF; margin-top: 20px; font-weight: 500; }
    .error { color: #ef4444; font-size: 14px; margin-top: 16px; padding: 16px; background: #fef2f2; border-radius: 12px; border-left: 4px solid #ef4444; text-align: left; }
    .success { color: #10b981; font-size: 16px; margin-top: 20px; padding: 16px; background: #ecfdf5; border-radius: 12px; font-weight: 600; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #e5e7eb; border-top-color: #5B6CFF; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .diagnostics { margin-top: 20px; padding: 16px; background: #f9fafb; border-radius: 12px; font-size: 13px; color: #6b7280; text-align: left; }
    .diagnostics strong { color: #1a1b1f; display: block; margin-bottom: 8px; }
    .check-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .check-item::before { content: '○'; font-size: 16px; }
    .check-item.pass::before { content: '✓'; color: #10b981; font-weight: bold; }
    .check-item.fail::before { content: '✗'; color: #ef4444; font-weight: bold; }
    .warning-box { background: #fffbeb; border: 1px solid #f59e0b; border-radius: 8px; padding: 12px; margin-bottom: 16px; color: #92400e; }
    .warning-box strong { display: block; margin-bottom: 4px; }
    .warning-box p { margin: 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" id="icon">🔐</div>
    <h1 id="title">Create Secure Passkey</h1>
    <p class="subtitle" id="subtitle">Set up biometric authentication to secure your confidential token wallet.</p>
    
    <div id="warning-box" class="warning-box hidden">
      <strong>⚠️ Don't close this window!</strong>
      <p>Please complete the authentication to secure your wallet.</p>
    </div>
    
    <div id="diagnostics" class="diagnostics hidden">
      <strong>Device Check:</strong>
      <div id="check-webauthn" class="check-item">WebAuthn API</div>
      <div id="check-platform" class="check-item">Platform Authenticator</div>
      <div id="check-userverification" class="check-item">User Verification</div>
    </div>
    
    <button id="authButton" class="auth-button">
      🔓 Start Setup
    </button>
    
    <button id="cancelButton" class="cancel-button">
      Cancel
    </button>
    
    <div id="status" class="status hidden"></div>
    <div id="error" class="error hidden"></div>
    <div id="success" class="success hidden"></div>
  </div>

  <script src="webauthn-helper.js"></script>
</body>
</html>
